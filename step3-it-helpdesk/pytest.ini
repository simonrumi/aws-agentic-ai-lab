[pytest]
# A plain `pytest` run skips the integration tests, so it never touches the
# network. Run them (personal laptop only, needs a live SSO login) with:
#   .venv\Scripts\python -m pytest -m integration
markers =
    integration: calls the real model, Lambdas and table on AWS (personal laptop only)
addopts = -m "not integration"
# Lets tests import shared files from this folder (seed_data, fake_table)
# and each Lambda's handler by folder, e.g. read_lambda.lambda_function —
# both Lambdas have a lambda_function.py, so the folder name tells them apart.
pythonpath = .
